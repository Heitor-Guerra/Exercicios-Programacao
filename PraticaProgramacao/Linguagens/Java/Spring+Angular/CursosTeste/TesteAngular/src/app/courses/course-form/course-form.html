


<mat-card class="form-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Course Manager</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="formGroup">
      <mat-form-field class="full-width">
        <mat-label>Course Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Course Description</mat-label>
        <textarea matInput formControlName="description"></textarea>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Course Category</mat-label>
        <mat-select formControlName="category">
          <mat-option value=""></mat-option>
          <mat-option value="Frontend">Frontend</mat-option>
          <mat-option value="Backend">Backend</mat-option>
          <mat-option value="Software">Software</mat-option>
          <mat-option value="Kernel">Kernel</mat-option>
          <mat-option value="Arquitecture">Arquitecture</mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <button matButton="filled" (click)="onSubmit()">SEND</button>
    <button matButton (click)="onCancel()">CANCEL</button>
  </mat-card-actions>
</mat-card>
